[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "pdf_estimator"
version = "1.0.0"
description = "Python wrapper for the PDF-Estimator C++ library (Farmer & Jacobs 2019)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib"]
authors = [
    {name = "Jenny Farmer"},
    {name = "Andrew Nashed"},
    {name = "Donald Jacobs"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/jennyfarmer/PDF-Estimator-Python"
Repository = "https://github.com/jennyfarmer/PDF-Estimator-Python"

[project.optional-dependencies]
dev = ["hypothesis", "pytest", "ruff"]

[tool.scikit-build]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (formatter handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["pdf_estimator"]
