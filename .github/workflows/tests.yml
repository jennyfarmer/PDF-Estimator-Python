name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Lint
        run: uvx ruff check .

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The ends plus a middle, rather than all of 3.11-3.15: enough to
        # catch version-specific breakage without a 15-cell matrix per PR.
        # The full matrix is built by release.yml via cibuildwheel.
        python-version: ["3.11", "3.13", "3.15"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Build package
        # Smoke check only. These wheels are NOT manylinux-repaired and must
        # never be published; release.yml builds the real ones.
        run: uv build

      - name: Install package and dev dependencies
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest
